<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>PixelForge</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #14161a;
        --panel: #1c1f26;
        --border: #2a2f3a;
        --text: #e6e9ef;
        --muted: #8b93a3;
        --accent: #4f8cff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
      }
      header {
        padding: 18px 24px;
        border-bottom: 1px solid var(--border);
      }
      header h1 { margin: 0; font-size: 18px; font-weight: 600; }
      header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
      main { padding: 20px 24px; }
      .toolbar { display: flex; gap: 10px; margin-bottom: 16px; }
      .notice {
        margin-bottom: 16px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
      }
      .danger {
        margin-left: auto;
        background: transparent;
        border: 1px solid #6b2b2b;
        border-radius: 6px;
        color: #ef9a9a;
        padding: 8px 14px;
        font: inherit;
        cursor: pointer;
      }
      .danger:hover:not(:disabled) { background: #2a1717; }
      .plugin-list { display: grid; gap: 10px; }
      .plugin {
        text-align: left;
        padding: 14px 16px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .plugin:hover { border-color: var(--accent); }
      .plugin .name { font-weight: 600; }
      .plugin .desc { color: var(--muted); margin-top: 4px; }
      .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
      .empty {
        border: 1px dashed var(--border);
        border-radius: 8px;
        padding: 40px;
        text-align: center;
        color: var(--muted);
      }
      .warnings { margin-top: 18px; color: #e0a458; font-size: 12px; }
      .warnings ul { margin: 6px 0 0; padding-left: 18px; }
      .back {
        background: none;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--muted);
        padding: 6px 12px;
        cursor: pointer;
        font: inherit;
      }
      .back:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      .detail h2 { margin: 16px 0 4px; font-size: 20px; }
      dl { display: grid; grid-template-columns: 100px 1fr; gap: 6px 16px; margin: 18px 0 0; }
      dt { color: var(--muted); }
      dd { margin: 0; }
      .note { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
      .form { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
      .field { margin-bottom: 16px; }
      .field label { display: block; font-weight: 600; margin-bottom: 4px; }
      .field .desc { margin: 0 0 6px; color: var(--muted); font-size: 12px; }
      .field-line { display: flex; gap: 10px; align-items: center; }
      .path {
        flex: 1;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .actions { display: flex; gap: 10px; margin-top: 18px; }
      button.primary, button.pick {
        background: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 6px;
        color: #fff;
        padding: 8px 16px;
        font: inherit;
        cursor: pointer;
      }
      button.primary:disabled {
        background: #2f3542;
        border-color: #2f3542;
        color: var(--muted);
        cursor: not-allowed;
      }
      button.pick { padding: 6px 12px; }
      .progress-track {
        height: 6px;
        margin-top: 18px;
        background: var(--panel);
        border-radius: 3px;
        overflow: hidden;
      }
      .progress-bar { height: 100%; width: 0; background: var(--accent); transition: width 0.15s; }
      h3 { font-size: 13px; color: var(--muted); margin: 22px 0 8px; }
      .log {
        max-height: 140px;
        overflow-y: auto;
        background: #0f1115;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        font-family: Consolas, monospace;
        font-size: 12px;
      }
      .log-line { color: var(--muted); white-space: pre-wrap; }
      .error {
        margin-top: 16px;
        padding: 10px 12px;
        border: 1px solid #6b2b2b;
        border-radius: 6px;
        background: #2a1717;
        color: #ef9a9a;
        white-space: pre-wrap;
      }
      .saved { margin-top: 12px; color: #8fd18f; font-size: 12px; }
      .preview { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
      .preview-item { margin: 0 0 16px; }
      .preview-item img {
        max-width: 100%;
        max-height: 320px;
        image-rendering: pixelated;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #0f1115;
      }
      .preview-item figcaption { color: var(--muted); font-size: 12px; margin-top: 6px; }
    </style>
  </head>
  <body>
    <header>
      <h1>PixelForge</h1>
      <p>图像处理工具箱 — 选择一个插件开始</p>
    </header>
    <main id="view"></main>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
